<svg width="600" height="146" viewBox="0 0 600 146" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="This repo runs on coffee and ⭐ Stars. Please contribute!">
  <defs>
    
  </defs>
  <style>
    
        .sq-line {
          overflow: hidden;
          white-space: pre;
          animation: sq-type 1.4s steps(30, end) both;
        }
        @keyframes sq-type {
          from { clip-path: inset(0 100% 0 0); }
          to   { clip-path: inset(0 0 0 0); }
        }
        .sq-author { animation: sq-fade 0.6s ease-in both; animation-delay: 1.5s; }
        @keyframes sq-fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect x="0" y="0" width="600" height="146" rx="10" fill="none"/>
  
  <text x="300" y="73" text-anchor="middle" class="sq-line" fill="#c9d1d9" font-size="18" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-weight="500">This repo runs on ⭐ Stars. Please contribute!</text>
  
</svg>